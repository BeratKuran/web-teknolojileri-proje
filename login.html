<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
    <div class="container">
        <a class="navbar-brand" href="index.html">Berat Kuran</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>

            </div>

</nav>

    <main class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-4">
                <div class="card shadow p-4">
                    <h3 class="text-center mb-4">Öğrenci Girişi</h3>
                    <form action="login_kontrol.php" method="POST" onsubmit="return validateLogin()">
                        <div class="mb-3">
                            <label class="form-label">Kullanıcı Adı (E-posta):</label>
                            <input type="text" name="email" id="login_email" class="form-control" placeholder="b2412100001@sakarya.edu.tr">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Şifre:</label>
                            <input type="password" name="sifre" id="login_sifre" class="form-control" placeholder="Öğrenci Numaranız">
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Giriş Yap</button>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <script>
        function validateLogin() {
            const email = document.getElementById('login_email').value;
            const sifre = document.getElementById('login_sifre').value;

            if (email === "" || sifre === "") {
                alert("Lütfen tüm alanları doldurunuz!");
                return false;
            }
            if (!email.includes('@')) {
                alert("Geçerli bir e-posta formatı giriniz!");
                return false;
            }
            return true; // Bilgiler boş değilse PHP tarafına gönderir
        }
    </script>
</body>
