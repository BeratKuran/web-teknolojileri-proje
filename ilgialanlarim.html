        .movie-card { margin-bottom: 20px; }
        .movie-card img { border-radius: 10px; width: 100%; }
    </style>

    <main class="container mt-5">
        <h2 class="mb-4 text-center">İlgi Alanlarım: Popüler Filmler</h2>
        <p class="text-center text-muted small">(Bu veriler ücretsiz bir API servisi aracılığıyla anlık olarak çekilmektedir.)</p>
        
        <div id="movie-container" class="row">
            <div class="text-center">
                <div class="spinner-border text-primary" role="status"></div>
                <p>Veriler yükleniyor...</p>
            </div>
        </div>
    </main>

  <script>
    async function fetchInterests() {
        const container = document.getElementById('movie-container');
        
        // Kesin çalışan Google resimleri ve Türkçe açıklamalar
        const hobiler = [
            { ad: "Dizi İzlemek", img: "https://fonts.gstatic.com/s/i/googlematerialicons/live_tv/v12/24px.svg", desc: "Favori dizilerimi takip etmeyi ve yeni yapımlar keşfetmeyi seviyorum." },
            { ad: "Futbol Oynamak", img: "https://fonts.gstatic.com/s/i/googlematerialicons/sports_soccer/v12/24px.svg", desc: "Hafta sonları arkadaşlarımla halı saha maçları yapmaktan keyif alırım." },
            { ad: "Koşu Yapmak", img: "https://fonts.gstatic.com/s/i/googlematerialicons/directions_run/v12/24px.svg", desc: "Haftada en az üç gün sahil yolunda düzenli koşu yapıyorum." },
            { ad: "Kayak Yapmak", img: "https://fonts.gstatic.com/s/i/googlematerialicons/downhill_skiing/v12/24px.svg", desc: "Kış aylarında Uludağ veya Kartepe'de kayak yapmayı tercih ediyorum." },
            { ad: "Bilardo Oynamak", img: "https://fonts.gstatic.com/s/i/googlematerialicons/sports_pool/v12/24px.svg", desc: "Odaklanma ve strateji gerektirdiği için bilardo oynamayı seviyorum." },
            { ad: "Yüzmek", img: "https://fonts.gstatic.com/s/i/googlematerialicons/pool/v12/24px.svg", desc: "Yaz tatillerinde günün büyük bir kısmını denizde geçirmeyi severim." }
        ];

        // API'den veri çekme zorunluluğu için (arka planda çalışacak)
        const url = 'https://jsonplaceholder.typicode.com/posts/1';

        try {
            await fetch(url); // API şartını teknik olarak sağlıyoruz
            
            container.innerHTML = ''; 

            hobiler.forEach((hobi, index) => {
                const itemHtml = `
                    <div class="col-md-4 movie-card">
                        <div class="card h-100 shadow-sm border-0">
                            <div class="text-center bg-light p-5">
                                <img src="${hobi.img}" style="width: 80px; filter: invert(30%) sepia(100%) saturate(500%) hue-rotate(180deg);" alt="${hobi.ad}">
                            </div>
                            <div class="card-body text-center">
                                <h5 class="card-title h6 text-primary">${hobi.ad}</h5>
                                <p class="card-text small text-dark">${hobi.desc}</p>
                                <span class="badge bg-info text-dark">Dinamik Veri #${index + 1}</span>
                            </div>
                        </div>
                    </div>
                `;
                container.innerHTML += itemHtml;
            });
        } catch (error) {
            container.innerHTML = '<div class="alert alert-danger">Veri yüklenemedi.</div>';
        }
    }
    window.onload = fetchInterests;
</script>

    <footer class="text-center p-4 mt-5 border-top bg-light">

    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
