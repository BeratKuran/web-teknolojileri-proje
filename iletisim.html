            <div class="col-md-8">
                <div class="card shadow p-4">
                    <h2 class="mb-4 border-bottom pb-2">İletişim Formu</h2>
                    
                    <form id="contactForm" action="islem.php" method="POST">
                        <div class="mb-3">
                            <label class="form-label font-weight-bold">Ad Soyad:</label>
                            <input type="text" name="adsoyad" id="adsoyad" class="form-control" placeholder="Adınızı yazınız...">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">E-posta Adresi:</label>
                            <input type="email" name="email" id="email" class="form-control" placeholder="ornek@sakarya.edu.tr">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">İletişim Nedeni:</label>
                            <select name="konu" class="form-select">
                                <option value="" selected disabled>Seçiniz...</option>
                                <option value="Oneri">Öneri</option>
                                <option value="Sikayet">Şikayet</option>
                                <option value="Soru">Soru</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label d-block">Cinsiyet:</label>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="cinsiyet" id="erkek" value="Erkek">
                                <label class="form-check-label" for="erkek">Erkek</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="cinsiyet" id="kadin" value="Kadın">
                                <label class="form-check-label" for="kadin">Kadın</label>
                            </div>
                        </div>

                        <div class="mb-3 form-check">
                            <input type="checkbox" class="form-check-input" name="kvkk" id="kvkk">
                            <label class="form-check-label" for="kvkk small">KVKK metnini okudum ve onaylıyorum.</label>
                        </div>

                        <div class="mt-4">
                            <button type="button" class="btn btn-primary me-2">JS Denetle (Yakında)</button>
                            <button type="reset" class="btn btn-outline-danger">Formu Temizle</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
