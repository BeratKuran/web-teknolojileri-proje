<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İletişim | Berat Kuran</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container">
            <div class="navbar-nav">
                <a class="nav-link" href="index.html">Hakkında</a>
                <a class="nav-link" href="cv.html">Özgeçmiş</a>
                <a class="nav-link" href="sehrim.html">Şehrim</a>
                <a class="nav-link" href="ilgi-alanlarim.html">İlgi Alanlarım</a>
                <a class="nav-link active" href="iletisim.html">İletişim</a>
                <a class="nav-link" href="#">Login</a>
            </div>
        </div>
    </nav>

    <main class="container mt-5" id="app">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow p-4">
                    <h2 class="mb-4 border-bottom pb-2">İletişim Formu</h2>
                    
                    <form id="contactForm" action="islem.php" method="POST">
                        <div class="mb-3">
                            <label class="form-label">Ad Soyad:</label>
                            <input type="text" name="adsoyad" id="adsoyad" class="form-control" v-model="formData.ad">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">E-posta Adresi:</label>
                            <input type="email" name="email" id="email" class="form-control" v-model="formData.email">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Mesajınız:</label>
                            <textarea name="mesaj" id="mesaj" class="form-control" rows="3" v-model="formData.mesaj"></textarea>
                        </div>

                        <div class="mt-4 d-flex gap-2">
                            <button type="button" class="btn btn-primary" onclick="validateNative()">JS ile Denetle & Gönder</button>
                            
                            <button type="button" class="btn btn-success" @click="validateVue">Vue.js ile Denetle & Gönder</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <script>
        // 1. Native JavaScript Kontrolü 
        function validateNative() {
            const ad = document.getElementById('adsoyad').value;
            const email = document.getElementById('email').value;
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            if (ad === "" || email === "") {
                alert("Lütfen tüm alanları doldurunuz! (Native JS Kontrolü)");
            } else if (!emailRegex.test(email)) {
                alert("Lütfen geçerli bir e-mail formatı giriniz! (Native JS Kontrolü)");
            } else {
                alert("Başarılı! Form PHP sayfasına yönlendiriliyor.");
                document.getElementById('contactForm').submit();
            }
        }

        // 2. Vue.js Kontrolü (Framework) 
        const { createApp } = Vue;
        createApp({
            data() {
                return {
                    formData: { ad: '', email: '', mesaj: '' }
                }
            },
            methods: {
                validateVue() {
                    if (this.formData.ad === "" || this.formData.email === "") {
                        alert("Hata: Boş alan bırakamazsınız! (Vue.js Kontrolü)");
                    } else if (this.formData.ad.length < 3) {
                        alert("Hata: İsim çok kısa! (Vue.js Kontrolü)");
                    } else {
                        alert("Başarılı: Vue.js denetimi geçti. Gönderiliyor...");
                        document.getElementById('contactForm').submit();
                    }
                }
            }
        }).mount('#app');
    </script>
</body>
</html>
