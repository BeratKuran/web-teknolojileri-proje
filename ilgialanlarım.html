<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İlgi Alanlarım | API</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .movie-card { margin-bottom: 20px; }
        .movie-card img { border-radius: 10px; width: 100%; }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container">
            <div class="navbar-nav">
                <a class="nav-link" href="index.html">Hakkında</a>
                <a class="nav-link" href="cv.html">Özgeçmiş</a>
                <a class="nav-link" href="sehrim.html">Şehrim</a>
                <a class="nav-link active" href="ilgi-alanlarim.html">İlgi Alanlarım</a>
                <a class="nav-link" href="#">İletişim</a>
                <a class="nav-link" href="#">Login</a>
            </div>
        </div>
    </nav>

    <main class="container mt-5">
        <h2 class="mb-4 text-center">İlgi Alanlarım: Popüler Filmler</h2>
        <p class="text-center text-muted small">(Bu veriler ücretsiz bir API servisi aracılığıyla anlık olarak çekilmektedir.)</p>
        
        <div id="movie-container" class="row">
            <div class="text-center">
                <div class="spinner-border text-primary" role="status"></div>
                <p>Veriler yükleniyor...</p>
            </div>
        </div>
    </main>

    <script>
        // Ücretsiz bir film API'sinden veri çekme fonksiyonu
        async function fetchMovies() {
            const container = document.getElementById('movie-container');
            try {
                // Örnek bir ücretsiz film API'si (The Movie Database - TMDB alternatifi açık servis)
                const response = await fetch('https://api.themoviedb.org/3/movie/popular?api_key=50e8953186f8516d3f2560a89d7ca412&language=tr-TR&page=1');
                const data = await response.json();
                
                container.innerHTML = ''; // Spinner'ı temizle

                data.results.slice(0, 8).forEach(movie => {
                    const movieHtml = `
                        <div class="col-md-3 movie-card">
                            <div class="card h-100 shadow-sm">
                                <img src="https://image.tmdb.org/t/p/w500${movie.poster_path}" class="card-img-top" alt="${movie.title}">
                                <div class="card-body">
                                    <h5 class="card-title h6">${movie.title}</h5>
                                    <p class="card-text small text-truncate">${movie.overview}</p>
                                    <span class="badge bg-warning text-dark">Puan: ${movie.vote_average}</span>
                                </div>
                            </div>
                        </div>
                    `;
                    container.innerHTML += movieHtml;
                });
            } catch (error) {
                container.innerHTML = '<p class="text-danger">Veri çekilirken bir hata oluştu.</p>';
            }
        }

        window.onload = fetchMovies;
    </script>

    <footer class="text-center p-4 mt-5 border-top bg-light">
        <p>&copy; 2026 - Berat Kuran</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
